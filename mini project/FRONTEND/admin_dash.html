<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Admin | Optimization Control</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        :root { --admin-bg: #0f172a; --card-bg: #1e293b; --primary: #38bdf8; --accent: #818cf8; --text: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--admin-bg); color: var(--text); margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #020617; height: 100vh; padding: 30px; box-sizing: border-box; }
        .sidebar h2 { color: var(--primary); font-size: 1.2rem; letter-spacing: 1px; margin-bottom: 2rem; }
        .menu-item { padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; transition: 0.3s; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover, .active { background: var(--card-bg); color: var(--primary); }

        /* Content */
        .main-content { flex: 1; padding: 40px; height: 100vh; overflow-y: auto; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        /* Interactive Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h4 { margin: 0; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        .stat-val { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }

        /* Controls */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .model-btn { background: #334155; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .model-btn.active-btn { background: var(--primary); color: #000; font-weight: bold; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #94a3b8; font-size: 0.8rem; padding: 10px; border-bottom: 1px solid #334155; }
        td { padding: 12px 10px; font-size: 0.9rem; border-bottom: 1px solid #334155; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .bg-green { background: #064e3b; color: #34d399; }
        .bg-red { background: #450a0a; color: #f87171; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>OPTIMIZER ADMIN</h2>
        <div class="menu-item active"><i class="fas fa-chart-line"></i> Analytics</div>
        <div class="menu-item"><i class="fas fa-bus"></i> Fleet Management</div>
        <div class="menu-item"><i class="fas fa-microchip"></i> Model Training</div>
        <div class="menu-item"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </nav>

    <main class="main-content">
        <header class="header">
            <h1>Model Performance Center</h1>
            <div id="sync-status"><span id="live-indicator">●</span> Live API Sync</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><h4>System MAE</h4><div class="stat-val">12.4</div><span style="color:var(--primary)">↓ 2.1%</span></div>
            <div class="stat-card"><h4>XGBoost R²</h4><div class="stat-val">0.94</div><span style="color:var(--primary)">Stable</span></div>
            <div class="stat-card"><h4>Peak Predicted</h4><div class="stat-val">17:45</div><span style="color:#f87171">High Load</span></div>
            <div class="stat-card"><h4>Fuel Saved</h4><div class="stat-val">14.2%</div><span style="color:var(--primary)">↑ 0.8%</span></div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="header" style="margin-bottom: 10px;">
                    <h3>Forecast Comparison</h3>
                    <div class="btn-group">
                        <button class="model-btn active-btn" onclick="toggleDataset(1)">ARIMA</button>
                        <button class="model-btn active-btn" onclick="toggleDataset(2)">Prophet</button>
                        <button class="model-btn active-btn" onclick="toggleDataset(3)">XGBoost</button>
                    </div>
                </div>
                <canvas id="adminForecastChart"></canvas>
            </div>

            <div class="card">
                <h3>Live Route Load</h3>
                <table>
                    <thead>
                        <tr><th>ROUTE</th><th>LOAD</th><th>MODEL</th><th>STATUS</th></tr>
                    </thead>
                    <tbody id="route-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let myChart;

        // Initialize Chart
        const ctx = document.getElementById('adminForecastChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    { label: 'Actual', data: [], borderColor: '#f1f5f9', borderWidth: 3, tension: 0.3 },
                    { label: 'ARIMA', data: [], borderColor: '#e67e22', borderDash: [5, 5], hidden: false },
                    { label: 'Prophet', data: [], borderColor: '#9b59b6', borderDash: [5, 5], hidden: false },
                    { label: 'XGBoost', data: [], borderColor: '#38bdf8', borderWidth: 2, hidden: false }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // Toggle Datasets Visibility
        function toggleDataset(index) {
            const isVisible = myChart.isDatasetVisible(index);
            if (isVisible) {
                myChart.hide(index);
                event.target.classList.remove('active-btn');
            } else {
                myChart.show(index);
                event.target.classList.add('active-btn');
            }
        }

        // Fetch Live Data from main.py
        async function fetchAdminData() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/forecast');
                const result = await response.json();
                const d = result.data;

                // Update Chart
                myChart.data.labels = d.labels;
                myChart.data.datasets[0].data = d.actual;
                myChart.data.datasets[1].data = d.arima;
                myChart.data.datasets[2].data = d.prophet;
                myChart.data.datasets[3].data = d.xgboost;
                myChart.update();

                // Update Table
                const tableBody = document.getElementById('route-table-body');
                const load = d.actual[0];
                const status = load > 500 ? '<span class="badge bg-red">HIGH</span>' : '<span class="badge bg-green">NORMAL</span>';
                
                tableBody.innerHTML = `
                    <tr><td>Blue Line (Chi)</td><td>${load}</td><td>XGBoost</td><td>${status}</td></tr>
                    <tr><td>Red Line (Chi)</td><td>${d.actual[2]}</td><td>Prophet</td><td><span class="badge bg-green">NORMAL</span></td></tr>
                    <tr><td>Union Exp</td><td>${d.actual[4]}</td><td>ARIMA</td><td><span class="badge bg-red">HIGH</span></td></tr>
                `;

            } catch (err) {
                console.error("Admin API Offline");
            }
        }

        fetchAdminData();
        setInterval(fetchAdminData, 10000);
    </script>
</body>
</html>
